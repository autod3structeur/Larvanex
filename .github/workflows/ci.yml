name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[pdf,yara]"

      - name: Generate samples
        run: python samples/generate_samples.py

      - name: Benign files must be clean (exit 0)
        run: |
          set +e
          larvanex --no-network --no-color samples/benign
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 0

      - name: Hidden payload must be flagged malicious (exit 2)
        run: |
          set +e
          larvanex --no-network --no-color samples/suspicious/hidden_payload.pdf > /dev/null
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: Recursive unpack + HTML report
        run: |
          larvanex scan --no-network --no-color --decompose --html report.html -r samples/suspicious || true
          test -s report.html

      - name: YARA rules are listed and load
        run: larvanex rules
