[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "larvanex"
version = "1.0.0"
description = "Beginner-friendly static malware triage: detect disguised, embedded and suspicious files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Larvanex contributors" }]
keywords = ["malware", "security", "dfir", "reverse-engineering", "pdf", "triage"]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
larvanex = "larvanex.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/Larvanex"

[tool.setuptools.packages.find]
include = ["larvanex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
