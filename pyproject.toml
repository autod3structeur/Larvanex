[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "larvanex"
version = "2.0.0"
description = "Static malware triage: detect disguised, embedded and suspicious files, recursively."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Larvanex contributors" }]
keywords = ["malware", "security", "dfir", "reverse-engineering", "pdf", "triage", "yara", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7.0", "pypdf>=4.0", "yara-python>=4.3"]

[project.scripts]
larvanex = "larvanex.cli:main"

[project.urls]
Homepage = "https://github.com/autod3structeur/Larvanex"
Repository = "https://github.com/autod3structeur/Larvanex"
Issues = "https://github.com/autod3structeur/Larvanex/issues"
Changelog = "https://github.com/autod3structeur/Larvanex/releases"

[tool.setuptools.packages.find]
include = ["larvanex*"]

[tool.setuptools.package-data]
larvanex = ["rules/*.yar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
